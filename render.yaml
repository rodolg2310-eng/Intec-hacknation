databases:
  - name: traina-db
    databaseName: apprentice
    user: apprentice
    plan: 256mb
    region: ohio
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: pserv
    name: traina-api
    runtime: docker
    plan: 1c-2g
    region: ohio
    dockerfilePath: ./Backend/Capacitación/apprentice-training-api/apprentice-training-api/Dockerfile
    dockerContext: ./Backend/Capacitación/apprentice-training-api/apprentice-training-api
    dockerCommand: >-
      sh -c 'AUTH="${DATABASE_CONNECTION_STRING#*://}";
      AUTH="${AUTH#*@}";
      DBHOST="${AUTH%%:*}";
      REST="${AUTH#*:}";
      DBPORT="${REST%%/*}";
      DBNAME="${REST#*/}";
      export DATABASE_URL="jdbc:postgresql://${DBHOST}:${DBPORT}/${DBNAME}?sslmode=require";
      exec java -jar /app/app.jar'
    disk:
      name: traina-media
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_CONNECTION_STRING
        fromDatabase:
          name: traina-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: traina-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: traina-db
          property: password
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DEMO_DATA
        value: "false"
      - key: APP_DATA_DIR
        value: /app/data
      - key: APP_ALLOWED_ORIGINS
        value: https://traina-web.onrender.com
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: ELEVENLABS_TTS_MODEL
        value: eleven_multilingual_v2

  - type: web
    name: traina-web
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./Frontend/traina/traina/Dockerfile
    dockerContext: ./Frontend/traina/traina
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: API_ORIGIN
        fromService:
          type: pserv
          name: traina-api
          property: hostport
