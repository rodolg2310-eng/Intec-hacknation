<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'Aspirante · ' + ${company.name}">Aspirante</title>
  <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
  <main class="tarjeta">
    <p class="etiqueta aspirante">Aspirante</p>
    <h1 th:text="${company.name}">Empresa</h1>
    <p class="sub">Hola, <span th:text="${email}"></span>.</p>
    <p>Aquí aprendes con lo que <strong>la IA te enseña</strong>, a partir de la experiencia de los expertos de tu empresa.</p>

    <!-- Aquí irá el entrenamiento que la IA da al aspirante -->

    <form method="post" th:action="@{/logout}">
      <button type="submit" class="secundario">Cerrar sesión</button>
    </form>
  </main>
</body>
</html>
