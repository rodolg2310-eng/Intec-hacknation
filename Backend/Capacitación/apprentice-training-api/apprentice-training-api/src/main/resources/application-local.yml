spring:
  datasource:
    url: jdbc:h2:file:${APP_DATA_DIR:./.runtime/data}/traina;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
apprentice:
  postgres-rls: false
  demo-data: false
